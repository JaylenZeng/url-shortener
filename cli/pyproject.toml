[project]
name = "shortener-cli"
version = "0.1.0"
description = "CLI client for URL shortener"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
shortener = "shortener_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"